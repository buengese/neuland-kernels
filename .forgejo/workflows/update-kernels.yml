name: Update kernels

on:
  schedule:
    # Daily, a little after the nixos-26.05-small channel usually advances.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and push even when kernel and ZFS are unchanged"
        type: boolean
        default: false

concurrency:
  group: update-kernels
  cancel-in-progress: false

jobs:
  update:
    name: Update nixpkgs and build x86_64-linux kernels
    runs-on: ubuntu-latest-big
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          # A personal access token with write access, so the resulting push
          # also triggers the build workflow. Falls back to the built-in token,
          # which can push but does not trigger further workflow runs.
          token: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = auto
            cores = 0

      - name: Configure Cachix
        uses: https://github.com/cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check for a newer kernel
        id: update
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: ./scripts/update-kernel.sh

      - name: Check flake
        if: steps.update.outputs.updated == 'true'
        run: nix flake check --no-build --all-systems

      - name: Build kernel packages
        if: steps.update.outputs.updated == 'true'
        run: |
          nix build \
            .#packages.x86_64-linux.neuland-kernel \
            .#packages.x86_64-linux.neuland-zfs \
            --no-link \
            --print-build-logs

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          base="$(git rev-parse HEAD)"

          git config user.name "Forgejo Actions"
          git config user.email "forgejo-actions@noreply.codeberg.org"
          git add flake.lock
          git commit --file "${{ steps.update.outputs.message_file }}"

          # The build takes hours; make sure nobody pushed in the meantime
          # instead of silently overwriting them.
          git fetch origin main
          remote="$(git rev-parse FETCH_HEAD)"
          if [ "$remote" != "$base" ]; then
            echo "main moved from ${base} to ${remote} while building, not pushing" >&2
            exit 1
          fi

          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.update.outputs.updated }}" = "true" ]; then
              echo "### ${{ steps.update.outputs.subject }}"
            else
              echo "### No kernel update"
            fi
            echo
            echo "| | before | after |"
            echo "| --- | --- | --- |"
            echo "| linux | ${{ steps.update.outputs.kernel_before }} | ${{ steps.update.outputs.kernel_after }} |"
            echo "| zfs | ${{ steps.update.outputs.zfs_before }} | ${{ steps.update.outputs.zfs_after }} |"
          } >>"$GITHUB_STEP_SUMMARY"
